apiVersion: v1
kind: ServiceAccount
metadata:
  name: openrath
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openrath
data:
  OPENRATH_APP: examples.v2_server_app:app
  OPENRATH_EMBEDDED_WORKER: "false"
  OPENRATH_DB_SCHEMA: openrath
  OPENRATH_TENANT_ID: default
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openrath-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: openrath
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/rath-team/openrath:2.0.0-review
          imagePullPolicy: IfNotPresent
          command: ["openrath-migrate"]
          envFrom:
            - configMapRef:
                name: openrath
            - secretRef:
                name: openrath-runtime
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrath
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openrath
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openrath
    spec:
      serviceAccountName: openrath
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openrath
          image: ghcr.io/rath-team/openrath:2.0.0-review
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: openrath
            - secretRef:
                name: openrath-runtime
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openrath
spec:
  selector:
    app.kubernetes.io/name: openrath
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrath-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openrath-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openrath-worker
    spec:
      serviceAccountName: openrath
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/rath-team/openrath:2.0.0-review
          command: ["openrath-worker", "--app", "examples.v2_server_app:server"]
          envFrom:
            - configMapRef:
                name: openrath
            - secretRef:
                name: openrath-runtime
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openrath
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openrath
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: openrath
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: openrath
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openrath-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openrath
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
