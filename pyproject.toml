[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrath"
version = "1.3.0"
description = "An open-source, torch-like API framework for dynamic multi-agent workflow."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0,<3",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Rath-Team/OpenRath"
Repository = "https://github.com/Rath-Team/OpenRath"
"Bug Tracker" = "https://github.com/Rath-Team/OpenRath/issues"

[project.optional-dependencies]
litellm = [
    "litellm>=1.80,<1.88",
]
opensandbox = [
    "opensandbox>=0.1.13",
    "opensandbox-code-interpreter>=0.1.2",
    "opensandbox-server>=0.2.1",
]
openviking = [
    "openviking>=0.4.7",
]
verl = [
    "verl>=0.8,<0.9; python_version < '3.13'",
]
benchmarks = [
    "pyyaml>=6",
]
trl = [
    "trl>=0.19",
    "datasets>=2.19",
]

[tool.ruff]
line-length = 88
exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
ignore = ["E203", "E501"]
extend-select = ["I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.hatch.build.targets.wheel]
packages = ["src/rath"]

[tool.hatch.build.targets.sdist]
# Ship only source-package essentials. Without an explicit include list,
# hatchling packs the whole working tree (docs assets, transient venvs, etc.),
# which bloated the sdist to tens of MB.
include = [
    "src/rath",
    "README.md",
    "README_zh.md",
    "LICENSE",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-benchmark>=4.0.0",
    "pytest-rerunfailures>=15.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.15.12",
]
docs = [
    "sphinx>=8.1.0",
    "myst-parser>=4.0.0",
    "pydata-sphinx-theme>=0.15.4",
]
