[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrath"
version = "2.0.0"
description = "An open-source, torch-like API framework for dynamic multi-agent workflow."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0,<3",
    "mcp>=1.28.1,<2",
]

[project.urls]
Homepage = "https://github.com/Rath-Team/OpenRath"
Repository = "https://github.com/Rath-Team/OpenRath"
"Bug Tracker" = "https://github.com/Rath-Team/OpenRath/issues"

[project.scripts]
openrath-server = "rath.server.cli:server_main"
openrath-migrate = "rath.server.cli:migrate_main"
openrath-worker = "rath.server.cli:worker_main"

[project.optional-dependencies]
litellm = [
    "litellm>=1.80,<1.88",
]
opensandbox = [
    "opensandbox>=0.1.15",
    "opensandbox-code-interpreter>=0.1.2",
    "opensandbox-server>=0.2.2",
]
openviking = [
    "openviking>=0.4.11",
    "aiohttp>=3.14.1",
    "json-repair>=0.60.1",
    "pillow>=12.3.0",
    "soupsieve>=2.8.4",
]
server = [
    "starlette>=1.3.1,<2",
    "uvicorn>=0.35,<1",
    "httpx>=0.28,<1",
]
postgres = [
    "psycopg[binary,pool]>=3.2,<4",
]
redis = [
    "redis>=6,<7",
]
otel = [
    "opentelemetry-api>=1.36,<2",
    "opentelemetry-sdk>=1.36,<2",
]
s3 = [
    "boto3>=1.40,<2",
]

[tool.ruff]
line-length = 88
exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
ignore = ["E203", "E501"]
extend-select = ["I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.hatch.build.targets.wheel]
packages = ["src/rath"]

[tool.hatch.build.targets.sdist]
# Ship only source-package essentials. Without an explicit include list,
# hatchling packs the whole working tree (docs assets, transient venvs, etc.),
# which bloated the sdist to tens of MB.
include = [
    "src/rath",
    "README.md",
    "README_zh.md",
    "LICENSE",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "opentelemetry-sdk>=1.36,<2",
    "pytest>=9.0.3",
    "pytest-benchmark>=4.0.0",
    "pytest-rerunfailures>=15.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.15.12",
]
docs = [
    "sphinx>=8.1.0",
    "myst-parser>=4.0.0",
    "pydata-sphinx-theme>=0.15.4",
]
