name: ShellCheck

on:
  push:
    branches: [main]
    paths:
      - 'scripts/*.sh'
      - '.shellcheckrc'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/*.sh'
      - '.shellcheckrc'

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: './scripts'
        env:
          SHELLCHECK_OPTS: -x
