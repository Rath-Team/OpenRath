name: Test OpenSandbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/rath/backend/**'
      - 'src/rath/session/**'
      - 'tests/backends/**'
      - 'tests/conformance/**'
      - 'tests/session/**'
      - 'scripts/ci_opensandbox_prepare.sh'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main]
    paths:
      - 'src/rath/backend/**'
      - 'src/rath/session/**'
      - 'tests/backends/**'
      - 'tests/conformance/**'
      - 'tests/session/**'
      - 'scripts/ci_opensandbox_prepare.sh'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  test-opensandbox:
    name: pytest (opensandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          # setup-uv's post-job "Pruning cache" step has been hanging for
          # 5+ minutes (timed-out exit 2) on this workflow even though the
          # test run itself finishes green; skip the prune to keep the
          # job from failing on cleanup.
          prune-cache: false
      - name: Install OpenSandbox dependencies
        run: uv sync --extra opensandbox --frozen
      - name: Init OpenSandbox config
        run: |
          export OPENSANDBOX_INSECURE_SERVER=YES
          uv run opensandbox-server init-config --example docker .sandbox.toml
      - name: Pre-pull sandbox image
        run: |
          IMAGE="$(uv run python -c 'from rath.backend.opensandbox import OpenSandboxBackend; print(OpenSandboxBackend._DEFAULT_IMAGE)')"
          echo "Pre-pulling ${IMAGE}"
          docker pull "${IMAGE}"
      - name: Start OpenSandbox server
        run: |
          export OPENSANDBOX_INSECURE_SERVER=YES
          uv run opensandbox-server --config .sandbox.toml &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "OpenSandbox server ready"
              exit 0
            fi
            echo "Waiting for OpenSandbox server... ($i/30)"
            sleep 2
          done
          echo "OpenSandbox server failed to start" >&2
          exit 1
      - name: Warm up OpenSandbox
        run: bash scripts/ci_opensandbox_prepare.sh
      - name: Run OpenSandbox tests
        run: uv run pytest -m opensandbox
