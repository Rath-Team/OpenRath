name: Collect v2.0.0 Gate C evidence

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Runner-local bundle directory name below the configured evidence root
        required: true
        type: string
      confirmation:
        description: Type "collect v2.0.0 gate c"
        required: true
        type: string

concurrency:
  group: collect-openrath-v2.0.0-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  collect:
    name: Validate and collect target evidence
    runs-on: [self-hosted, linux, openrath-ga]
    timeout-minutes: 15
    environment:
      name: ga-evidence
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: read # Check out the exact candidate source for its verifier.
    env:
      BUNDLE_ID: ${{ inputs.bundle_id }}
      EVIDENCE_ROOT: ${{ vars.OPENRATH_GA_EVIDENCE_ROOT }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      VERSION: 2.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate candidate and protected target bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_CONFIRMATION" = "collect v2.0.0 gate c"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          project_version="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          print(re.search(r'^version = "([^"]+)"$', text, re.MULTILINE).group(1))
          PY
          )"
          test "$project_version" = "$VERSION"
          [[ "$BUNDLE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          test -n "$EVIDENCE_ROOT"
          [[ "$EVIDENCE_ROOT" = /* ]]

          root_real="$(realpath "$EVIDENCE_ROOT")"
          source_real="$(realpath "$root_real/$BUNDLE_ID")"
          case "$source_real" in
            "$root_real"/*) ;;
            *)
              echo "Evidence bundle escapes the configured root." >&2
              exit 1
              ;;
          esac
          test -d "$source_real"
          if find "$source_real" -type l -print -quit | grep -q .; then
            echo "Evidence bundles must not contain symbolic links." >&2
            exit 1
          fi
          bundle_kib="$(du -sk "$source_real" | awk '{print $1}')"
          test "$bundle_kib" -le 2097152

          destination="$RUNNER_TEMP/gates"
          mkdir "$destination"
          cp -a --no-preserve=ownership "$source_real/." "$destination/"
          python3 scripts/release/verify_gate_bundle.py "$destination"
          python3 scripts/release/verify_gate_reports.py \
            "$destination" \
            --source-commit "$GITHUB_SHA" \
            --artifact-root "$destination"
      - name: Upload immutable Gate C input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openrath-v2.0.0-ga-input
          path: ${{ runner.temp }}/gates
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
