name: Publish v2.0.0 GA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated GA tag
        required: true
        type: string
      evidence_run_id:
        description: Successful run containing openrath-v2.0.0-ga-input
        required: true
        type: string
      confirmation:
        description: Type "publish v2.0.0" to authorize this run
        required: true
        type: string

concurrency:
  group: publish-openrath-v2.0.0
  cancel-in-progress: false

permissions: {}

jobs:
  publish-ga:
    name: Verify evidence, publish OCI, and attest
    runs-on: ubuntu-latest
    environment:
      name: ga-release
      url: https://github.com/${{ github.repository }}/releases/tag/v2.0.0
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      image_digest: ${{ steps.push_image.outputs.digest }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
      IMAGE: ghcr.io/rath-team/openrath
      TRIVY_IMAGE: aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
      VERSION: 2.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Validate dispatch, tag, version, and main ancestry
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_CONFIRMATION" = "publish v2.0.0"
          test "$RELEASE_TAG" = "v2.0.0"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          project_version="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          print(re.search(r'^version = "([^"]+)"$', text, re.MULTILINE).group(1))
          PY
          )"
          test "$project_version" = "$VERSION"
          test -f "release/notes/v${VERSION}.md"
          ! grep -Eq 'TODO|HOLD|DRAFT' "release/notes/v${VERSION}.md"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Download and verify same-SHA Gate C evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_json="$(gh run view "$EVIDENCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json headSha,conclusion)"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .headSha <<<"$run_json")" = "$SOURCE_SHA"
          gate_dir="release/evidence/$VERSION/gates"
          mkdir -p "$gate_dir"
          gh run download "$EVIDENCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name openrath-v2.0.0-ga-input \
            --dir "$gate_dir"
          uv run python scripts/release/verify_gate_reports.py \
            "$gate_dir" \
            --source-commit "$SOURCE_SHA"
      - name: Record protected-environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          review_history="$RUNNER_TEMP/environment-approvals.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            > "$review_history"
          uv run python scripts/release/create_ga_approval.py \
            --version "$VERSION" \
            --source-commit "$SOURCE_SHA" \
            --requested-by "$GITHUB_ACTOR" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --review-history "$review_history" \
            --output release/evidence/"$VERSION"/ga-approval.json
      - name: Verify source and package gates
        run: |
          uv lock --check
          uv sync --frozen --all-extras --all-groups
          uv run ruff format --check src tests example
          uv run ruff check src tests scripts examples
          uv run mypy --no-incremental src/rath
          uv run pytest -q -n auto \
            -m "not live_llm and not opensandbox and not openviking"
          uv run python scripts/export_openapi_v2.py \
            --output "$RUNNER_TEMP/openapi-v2.json"
          diff -u deploy/docs/openapi-v2.json "$RUNNER_TEMP/openapi-v2.json"
          uv build
          uvx twine check dist/*
      - name: Audit exact dependency sets
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --extra server --extra postgres --extra s3 --extra redis --extra otel \
            --output-file production-requirements.txt
          uvx pip-audit --no-deps --disable-pip \
            --format json \
            --output release/evidence/"$VERSION"/dependency-audit-production.json \
            -r production-requirements.txt
          uv export --frozen --all-extras --all-groups --no-emit-project \
            --output-file all-requirements.txt
          uvx pip-audit --no-deps --disable-pip \
            --format json \
            --output release/evidence/"$VERSION"/dependency-audit-all.json \
            -r all-requirements.txt
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the final image once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.SOURCE_SHA }}
          build-args: |
            OPENRATH_VERSION=${{ env.VERSION }}
            OPENRATH_REVISION=${{ env.SOURCE_SHA }}
      - name: Scan the final image and source
        run: |
          evidence_dir="release/evidence/$VERSION"
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$PWD:/workspace" \
            "$TRIVY_IMAGE" image \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            --format json \
            --output "/workspace/$evidence_dir/image-scan.json" \
            "$IMAGE:$VERSION"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$PWD:/workspace" \
            "$TRIVY_IMAGE" image \
            --format cyclonedx \
            --output "/workspace/$evidence_dir/sbom.cdx.json" \
            "$IMAGE:$VERSION"
          docker run --rm \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$PWD:/workspace:ro" \
            -v "$PWD/$evidence_dir:/evidence" \
            "$TRIVY_IMAGE" fs \
            --scanners secret \
            --exit-code 1 \
            --format json \
            --output /evidence/secret-scan.json \
            --skip-dirs /workspace/.git \
            --skip-dirs /workspace/.venv \
            --skip-dirs /workspace/.mypy_cache \
            --skip-dirs /workspace/.pytest_cache \
            --skip-dirs /workspace/.ruff_cache \
            --skip-dirs /workspace/build \
            --skip-dirs /workspace/dist \
            /workspace
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the already-scanned image
        id: push_image
        run: |
          push_output="$(docker push "$IMAGE:$VERSION")"
          printf '%s\n' "$push_output"
          digest="$(sed -n \
            's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' \
            <<<"$push_output" | tail -1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker push "$IMAGE:$SOURCE_SHA"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build and verify final SHA-bound evidence
        env:
          IMAGE_DIGEST: ${{ steps.push_image.outputs.digest }}
        run: |
          evidence_dir="release/evidence/$VERSION"
          sed "s#${IMAGE}:${VERSION}#${IMAGE}@${IMAGE_DIGEST}#g" \
            deploy/kubernetes/openrath.yaml \
            > "$evidence_dir/openrath-kubernetes.yaml"
          uv run python scripts/release/build_evidence.py \
            --stage ga \
            --tag "$RELEASE_TAG" \
            --approval "$evidence_dir/ga-approval.json" \
            --image-ref "$IMAGE" \
            --image-digest "$IMAGE_DIGEST" \
            --output "$evidence_dir/manifest.json" \
            --artifact sbom="$evidence_dir/sbom.cdx.json" \
            --artifact image_scan="$evidence_dir/image-scan.json" \
            --artifact secret_scan="$evidence_dir/secret-scan.json" \
            --artifact dependency_audit_production="$evidence_dir/dependency-audit-production.json" \
            --artifact dependency_audit_all="$evidence_dir/dependency-audit-all.json" \
            --artifact kubernetes="$evidence_dir/openrath-kubernetes.yaml" \
            --artifact tests="$evidence_dir/gates/tests.json" \
            --artifact live_adapters="$evidence_dir/gates/live-adapters.json" \
            --artifact performance="$evidence_dir/gates/performance.json" \
            --artifact soak="$evidence_dir/gates/soak.json" \
            --artifact drills="$evidence_dir/gates/drills.json" \
            --artifact compatibility="$evidence_dir/gates/compatibility.json"
          uv run python scripts/release/verify_evidence.py \
            "$evidence_dir/manifest.json"
      - name: Attest the final OCI digest
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push_image.outputs.digest }}
          push-to-registry: true
      - name: Upload the final release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openrath-2.0.0-release
          retention-days: 90
          if-no-files-found: error
          path: |
            dist/*
            release/evidence/2.0.0/*
            scripts/release/verify_pypi_files.py

  publish-pypi:
    name: Publish distributions to PyPI
    needs: publish-ga
    runs-on: ubuntu-latest
    environment:
      name: ga-release
      url: https://pypi.org/p/openrath
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openrath-2.0.0-release
          path: release-bundle
      - name: Reject conflicting existing PyPI files
        run: |
          python release-bundle/scripts/release/verify_pypi_files.py \
            --packages-dir release-bundle/dist \
            --version 2.0.0
      - name: Publish package distributions with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-bundle/dist
          print-hash: true
          skip-existing: true

  publish-github:
    name: Create the final GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: v2.0.0
      VERSION: 2.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openrath-2.0.0-release
          path: release-bundle
      - name: Create the immutable final release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            release-bundle/dist/* \
            release-bundle/release/evidence/"$VERSION"/*.json \
            release-bundle/release/evidence/"$VERSION"/*.yaml \
            release-bundle/release/evidence/"$VERSION"/gates/*.json \
            --verify-tag \
            --title "OpenRath $VERSION" \
            --notes-file "release/notes/v${VERSION}.md"

  verify-publication:
    name: Verify public GA artifacts
    needs: [publish-ga, publish-github]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/rath-team/openrath
      IMAGE_DIGEST: ${{ needs.publish-ga.outputs.image_digest }}
      VERSION: 2.0.0
    steps:
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12'
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openrath-2.0.0-release
          path: release-bundle
      - name: Verify published PyPI files match the release bundle
        run: |
          python release-bundle/scripts/release/verify_pypi_files.py \
            --packages-dir release-bundle/dist \
            --version "$VERSION" \
            --require-complete \
            --attempts 12 \
            --delay-seconds 10
      - name: Verify a fresh PyPI installation
        run: |
          uv venv "$RUNNER_TEMP/verify"
          uv pip install \
            --python "$RUNNER_TEMP/verify/bin/python" \
            --no-cache \
            "openrath==$VERSION"
          "$RUNNER_TEMP/verify/bin/python" -c \
            "import importlib.metadata; assert importlib.metadata.version('openrath') == '$VERSION'"
      - name: Verify anonymous OCI access and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/docker-anonymous"
          DOCKER_CONFIG="$RUNNER_TEMP/docker-anonymous" \
            docker manifest inspect "$IMAGE@$IMAGE_DIGEST" >/dev/null
          gh attestation verify \
            "oci://$IMAGE@$IMAGE_DIGEST" \
            --repo "$GITHUB_REPOSITORY"
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
