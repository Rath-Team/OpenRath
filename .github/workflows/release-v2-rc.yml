name: Publish v2 release candidate

on:
  push:
    tags:
      - 'v2.0.0rc*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v2.0.0rcN tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish-rc:
    name: Build, attest, and publish RC
    runs-on: ubuntu-latest
    environment: rc-release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      IMAGE: ghcr.io/rath-team/openrath
      TRIVY_IMAGE: aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Validate tag and project version
        run: |
          version="${RELEASE_TAG#v}"
          project_version="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          print(re.search(r'^version = "([^"]+)"$', text, re.MULTILINE).group(1))
          PY
          )"
          test "$version" = "$project_version"
          test -f "release/notes/v${version}.md"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify source and package gates
        run: |
          uv lock --check
          uv sync --frozen --all-extras --all-groups
          uv run ruff format --check src tests example
          uv run ruff check src tests scripts examples
          uv run mypy --no-incremental src/rath
          uv run pytest -q -n auto -m "not live_llm and not opensandbox and not openviking"
          uv run python scripts/export_openapi_v2.py --output "$RUNNER_TEMP/openapi-v2.json"
          diff -u deploy/docs/openapi-v2.json "$RUNNER_TEMP/openapi-v2.json"
          uv build
          uvx twine check dist/*
      - name: Audit exact production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --extra server --extra postgres --extra s3 --extra redis --extra otel \
            --output-file production-requirements.txt
          uvx pip-audit --no-deps --disable-pip \
            --format json --output dependency-audit-production.json \
            -r production-requirements.txt
          uv export --frozen --all-extras --all-groups --no-emit-project \
            --output-file all-requirements.txt
          uvx pip-audit --no-deps --disable-pip \
            --format json --output dependency-audit-all.json \
            -r all-requirements.txt
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable RC image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.SOURCE_SHA }}
          build-args: |
            OPENRATH_VERSION=${{ env.VERSION }}
            OPENRATH_REVISION=${{ env.SOURCE_SHA }}
      - name: Pull, scan, and describe published image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p release/evidence/"$VERSION"
          docker pull "$IMAGE@$IMAGE_DIGEST"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace" \
            "$TRIVY_IMAGE" image \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            --format json \
            --output /workspace/release/evidence/"$VERSION"/image-scan.json \
            "$IMAGE@$IMAGE_DIGEST"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace" \
            "$TRIVY_IMAGE" image \
            --format cyclonedx \
            --output /workspace/release/evidence/"$VERSION"/sbom.cdx.json \
            "$IMAGE@$IMAGE_DIGEST"
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$PWD/release/evidence/$VERSION:/evidence" \
            "$TRIVY_IMAGE" fs \
            --scanners secret \
            --exit-code 1 \
            --format json \
            --output /evidence/secret-scan.json \
            --skip-dirs /workspace/.git \
            --skip-dirs /workspace/.venv \
            --skip-dirs /workspace/.mypy_cache \
            --skip-dirs /workspace/.pytest_cache \
            --skip-dirs /workspace/.ruff_cache \
            --skip-dirs /workspace/build \
            --skip-dirs /workspace/dist \
            /workspace
          cp dependency-audit-production.json release/evidence/"$VERSION"/
          cp dependency-audit-all.json release/evidence/"$VERSION"/
          sed "s#${IMAGE}:${VERSION}#${IMAGE}@${IMAGE_DIGEST}#g" \
            deploy/kubernetes/openrath.yaml \
            > release/evidence/"$VERSION"/openrath-kubernetes.yaml
      - name: Build and verify SHA-bound evidence
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          uv run python scripts/release/build_evidence.py \
            --tag "$RELEASE_TAG" \
            --image-ref "$IMAGE" \
            --image-digest "$IMAGE_DIGEST" \
            --output release/evidence/"$VERSION"/manifest.json \
            --artifact sbom=release/evidence/"$VERSION"/sbom.cdx.json \
            --artifact image_scan=release/evidence/"$VERSION"/image-scan.json \
            --artifact secret_scan=release/evidence/"$VERSION"/secret-scan.json \
            --artifact dependency_audit_production=release/evidence/"$VERSION"/dependency-audit-production.json \
            --artifact dependency_audit_all=release/evidence/"$VERSION"/dependency-audit-all.json \
            --artifact kubernetes=release/evidence/"$VERSION"/openrath-kubernetes.yaml
          uv run python scripts/release/verify_evidence.py \
            release/evidence/"$VERSION"/manifest.json
      - name: Attest published image
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openrath-${{ env.VERSION }}-release
          retention-days: 90
          if-no-files-found: error
          path: |
            dist/*
            release/evidence/${{ env.VERSION }}/*
      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber \
              dist/* release/evidence/"$VERSION"/*
            gh release edit "$RELEASE_TAG" \
              --prerelease \
              --title "OpenRath $VERSION" \
              --notes-file "release/notes/v${VERSION}.md"
          else
            gh release create "$RELEASE_TAG" \
              dist/* release/evidence/"$VERSION"/* \
              --verify-tag \
              --prerelease \
              --title "OpenRath $VERSION" \
              --notes-file "release/notes/v${VERSION}.md"
          fi
